version: 2

# Build documentation with Zensical (mkdocs.yml is still the config file)
mkdocs:
  configuration: mkdocs.yml

formats: all

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    build:
      html:
        - zensical build --clean --config-file mkdocs.yml
        - mkdir -p $READTHEDOCS_OUTPUT/html
        - cp -r site/. $READTHEDOCS_OUTPUT/html/

python:
  install:
    - requirements: docs/requirements.txt